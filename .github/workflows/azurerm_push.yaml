name: Terraform AzureRM Test

on:
  # Manual execution
  workflow_dispatch:

  # Run automatically when Terraform configuration changes
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "user-data.sh"
      - ".github/workflows/azurerm_push.yaml"

  # Validate changes in Pull Requests
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "user-data.sh"
      - ".github/workflows/azurerm_push.yaml"

permissions:
  contents: read

jobs:

  # =======================================================
  # TERRAFORM PLAN
  # =======================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Terraform Setup
      # ---------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------
      # Terraform Format
      # ---------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check -recursive

      # ---------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ---------------------------------------------------
      # Terraform Validate
      # ---------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # ---------------------------------------------------
      # Azure Login
      # ---------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------
      # Terraform Plan
      # ---------------------------------------------------

      - name: Terraform Plan
        env:
          TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
        run: terraform plan -out=tfplan

      # ---------------------------------------------------
      # Upload Terraform Plan
      # ---------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1

  # =======================================================
  # TERRAFORM APPLY
  # =======================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # Apply only for pushes to main.
    # Pull Requests run Plan only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # =====================================================
    # MANUAL APPROVAL
    #
    # Configure required reviewers in:
    #
    # Repository
    #   → Settings
    #   → Environments
    #   → terraform-test
    #   → Required reviewers
    #
    # =====================================================

    environment:
      name: terraform-test

    env:
      TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Terraform Setup
      # ---------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ---------------------------------------------------
      # Download Terraform Plan
      # ---------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      # ---------------------------------------------------
      # Azure Login
      # ---------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------
      # Terraform Apply
      # ---------------------------------------------------

      - name: Terraform Apply
        run: terraform apply tfplan