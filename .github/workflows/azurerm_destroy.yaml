name: Terraform AzureRM Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =======================================================
  # TERRAFORM DESTROY
  # =======================================================

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    # Manual approval before destruction
    environment:
      name: terraform-test

    env:
      TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Setup Terraform
      # ---------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      # ---------------------------------------------------
      # Azure Login
      # ---------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------
      # Show Terraform State
      # ---------------------------------------------------

      - name: Terraform State List
        run: |
          echo "=========================================="
          echo "Terraform State"
          echo "=========================================="

          terraform state list

      # ---------------------------------------------------
      # Destroy Plan
      # ---------------------------------------------------

      - name: Terraform Destroy Plan
        run: |
          echo "=========================================="
          echo "Terraform Destroy Plan"
          echo "=========================================="

          terraform plan \
            -destroy \
            -out=destroy.tfplan

      # ---------------------------------------------------
      # Destroy
      # ---------------------------------------------------

      - name: Terraform Destroy
        run: |
          echo "=========================================="
          echo "Terraform Destroy"
          echo "=========================================="

          terraform apply \
            -auto-approve \
            destroy.tfplan